[tools]
node = "24"
# CLI tools: prebuilt binaries, no compiling (see CHEATSHEET.md)
fzf = "latest"
zoxide = "latest"
bat = "latest"
fd = "latest"
ripgrep = "latest"
delta = "latest"
lazygit = "latest"

[settings]
# honour .nvmrc / .node-version files in projects
idiomatic_version_file_enable_tools = ["node"]
