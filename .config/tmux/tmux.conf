# Enable mouse control
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g @catppuccin_flavour 'mocha'

# Copy the tmux selection to the system clipboard.
# mode-keys follows $EDITOR/$VISUAL, so bind both copy-mode tables.
if-shell 'command -v pbcopy' \
  'set -g @copy_command "pbcopy"' \
  'set -g @copy_command "xclip -i -selection clipboard"'
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# vi keys in copy mode (prefix [): v starts a selection, y copies it.
# Set explicitly: tmux would otherwise pick vi or emacs from $EDITOR.
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# New panes and windows open in the current pane's directory.
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"
bind-key c   new-window -c "#{pane_current_path}"

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind-key x kill-pane
bind-key & kill-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# enable colors in tmux sessions
# tmux-256color would be nicer but its terminfo entry is missing on macOS,
# so stay on screen-256color.
set -g default-terminal "screen-256color"
# Truecolor only where the outer terminal supports it. macOS Terminal.app
# (before macOS 26) reports xterm-256color but garbles 24-bit colour; VTE
# terminals like GNOME Terminal advertise support via COLORTERM.
set -ga terminal-overrides ",xterm-kitty:Tc,xterm-ghostty:Tc"
if-shell '[ "$COLORTERM" = truecolor ] || [ "$COLORTERM" = 24bit ]' \
  'set -ga terminal-overrides ",*256col*:Tc"'

# TPM lives next to this config: because tmux.conf is in $XDG_CONFIG_HOME/tmux,
# TPM installs plugins into ~/.config/tmux/plugins, so run it from there too.
run '~/.config/tmux/plugins/tpm/tpm'
