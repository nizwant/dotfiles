# Enable mouse control
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g @catppuccin_flavour 'mocha'

# Copy the tmux selection to the system clipboard.
# mode-keys follows $EDITOR/$VISUAL, so bind both copy-mode tables.
if-shell 'command -v pbcopy' \
  'set -g @copy_command "pbcopy"' \
  'set -g @copy_command "xclip -i -selection clipboard"'
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"

bind-key x kill-pane
bind-key & kill-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# enable colors in tmux sessions
# tmux-256color would be nicer but its terminfo entry is missing on macOS,
# so stay on screen-256color and add truecolor back with the Tc override.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-kitty:Tc"

# TPM lives next to this config: because tmux.conf is in $XDG_CONFIG_HOME/tmux,
# TPM installs plugins into ~/.config/tmux/plugins, so run it from there too.
run '~/.config/tmux/plugins/tpm/tpm'
